<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>Пристрій</title></head><body><h1>{{ device.name }}</h1><p>Серійний номер: {{ device.serial }}</p><h2>Вимірювання</h2><ul>{% for m in measurements %}<li>{{ m.measured_at|date:'c' }}: {{ m.temperature }} °C</li>{% empty %}<li>Немає вимірювань</li>{% endfor %}</ul><a href="{% url 'monitoring:index' %}">Усі пристрої</a></body></html>
